<!doctype html>
<html lang="fr">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page de contrôle défectueuse</title>
<!-- Page d'essai des scripts, volontairement mauvaise : lecture de la mise en page à chaque image, largeur animée, animation
     qui tourne hors écran, élément plus large qu'un téléphone. Chaque script doit la faire échouer. -->
<style>
  body { margin: 0; font: 18px system-ui; background: #101317; color: #e8edf2; }
  section { min-height: 100vh; display: grid; place-items: center; }
  .bloc { height: 120px; background: #e86f6f; }
  .large { width: 900px; height: 40px; background: #333; }
  .lourd > i { display: block; height: 4px; margin: 2px 0; background: #555; }
</style>
<section id="un"><div class="bloc" data-bloc></div></section>
<section id="deux"><div class="large"></div><div class="lourd" data-lourd></div></section>
<section id="trois"><p>Fin de la page.</p></section>
<script>
  const bloc = document.querySelector("[data-bloc]");
  const lourd = document.querySelector("[data-lourd]");
  for (let i = 0; i < 400; i++) lourd.append(document.createElement("i"));
  const lignes = [...lourd.children];
  let t = 0;
  const boucle = () => {
    t += 1;
    // mal : on lit la mise en page, puis on écrit une largeur, à chaque image, même hors écran
    const haut = bloc.getBoundingClientRect().top;
    bloc.style.width = 200 + 100 * Math.sin(t / 20) + (haut > 1e9 ? 1 : 0) + "px";
    lignes.forEach((l, i) => {
      l.style.width = 50 + 40 * Math.sin((t + i) / 15) + "%";
      l.offsetWidth; // relecture forcée à chaque ligne
    });
    requestAnimationFrame(boucle);
  };
  requestAnimationFrame(boucle);
</script>
</html>
